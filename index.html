<body class="loading">
<script>
/* Filet de sécurité : si l'app ne démarre pas, on propose de la réparer au lieu d'un chargement sans fin. */
(function () {
  var started = false, shown = false, base = location.origin + location.pathname.replace(/[^\/]*$/, '');
  window.__frigoStarted = function () { started = true; var p = document.getElementById('bootfail'); if (p) p.parentNode.removeChild(p); };
  window.__frigoRepair = function () {
    var go = function () { location.replace(location.pathname.replace(/[^\/]*$/, '') + '?r=' + Date.now()); }, jobs = [];
    if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope.indexOf(base) === 0; }).map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('mon-frigo-') === 0 || /^frigo-v\d+$/.test(k); }).map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).then(go, go);
  };
  function fail() {
    if (started || shown) return; shown = true;
    var d = document.createElement('div'); d.id = 'bootfail'; d.setAttribute('role', 'alert');
    d.style.cssText = 'position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;justify-content:center;padding:28px;background:#f3f5f7;color:#2a1a25;font:16px/1.5 system-ui,sans-serif';
    var b = 'display:block;width:100%;min-height:52px;margin-top:10px;border:0;border-radius:16px;text-align:center;font:700 16px system-ui,sans-serif;';
    d.innerHTML = '<p style="font-size:44px;margin:0 0 8px">🧊</p><p style="font-weight:700;font-size:21px;margin:0 0 6px">Le chargement est bloqué</p><p style="margin:0 0 16px;color:#6c6070">Une ancienne version est sans doute restée en mémoire sur ce téléphone. La réparation la supprime et garde toutes tes données.</p>'
      + '<button type="button" id="bf-fix" style="' + b + 'background:#e2017b;color:#fff">Réparer et relancer</button><button type="button" id="bf-retry" style="' + b + 'background:#e9edf1;color:#2a1a25">Réessayer</button>';
    document.body.appendChild(d);
    document.getElementById('bf-fix').onclick = window.__frigoRepair;
    document.getElementById('bf-retry').onclick = function () { location.reload(); };
  }
  setTimeout(fail, 12000);
  window.addEventListener('error', function (e) { var t = e && e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) fail(); }, true);
})();
</script>

<span class="offline-badge" aria-live="polite">Hors ligne</span>
<main id="view" aria-live="polite"><div class="boot"><div class="spinner"></div><p class="muted">Chargement…</p></div></main>
<nav id="tabbar" class="tabbar" aria-label="Navigation principale"></nav>
<div id="sheets"></div>
<div id="toasts" class="toasts"></div>
<noscript><p style="padding:24px">Mon Frigo a besoin de JavaScript pour fonctionner.</p></noscript>
<script src="app.js?v=1.2.0" defer></script>
</body>
</html>
